name: Miao Checkin

on:
  workflow_dispatch:
  schedule:
    - cron: "5 1 * * *"

concurrency:
  group: miao-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
      TG_TARGET_BOT: ${{ vars.TG_TARGET_BOT }}
      TG_CHECKIN_COMMAND: ${{ vars.TG_CHECKIN_COMMAND }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate required secrets
        run: |
          test -n "$TG_API_ID" || (echo "Missing secret TG_API_ID" && exit 1)
          test -n "$TG_API_HASH" || (echo "Missing secret TG_API_HASH" && exit 1)
          test -n "$TG_STRING_SESSION" || (echo "Missing secret TG_STRING_SESSION" && exit 1)

      - name: Send check-in
        run: python checkin.py
